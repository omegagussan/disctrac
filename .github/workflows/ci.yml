name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The app imports a fixture from fixtures/ as a build-time asset, so the
      # real video must be present — without this, checkout leaves a ~130-byte
      # LFS pointer and the build silently bundles that as the video.
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `npm run build` is `tsc -b && vite build`, so this covers typechecking
      # of the app, the worker, and the vite config in one step.
      - name: Typecheck and build
        run: npm run build
